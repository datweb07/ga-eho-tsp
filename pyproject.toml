[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-eho-tsp"
version = "0.1.0"
description = "GA for symmetric TSP; EHO planned"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
legacy = ["numpy==2.4.6", "matplotlib==3.11.2", "networkx==3.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
